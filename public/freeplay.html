<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Shop — Freeplay</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/freeplay.css">
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div>
      <h1>Freeplay</h1>
      <div class="sub">32-step pattern generator</div>
    </div>
    <a class="back" href="index.html">&larr; Modes</a>
  </div>

  <div id="notice" class="notice"></div>

  <div id="familyPicker" class="family-picker"></div>
  <div id="variantPicker" class="variant-picker"></div>

  <div class="transport">
    <button id="playBtn" class="primary">Play</button>
    <button id="randomizeBtn">Randomize</button>
    <button id="clearBtn">Clear</button>
    <button id="saveBtn">Save</button>
    <div class="field">
      <label for="bpm">BPM: <span id="bpmVal">110</span></label>
      <input type="range" id="bpm" min="60" max="200" value="110">
    </div>
    <div class="mississippi" id="mississippi">1 Mississippi</div>
  </div>

  <div class="grid" id="grid"></div>

  <div id="assistPanel"></div>

  <h3 style="font-family:Georgia,serif; font-weight:normal; margin-top:26px;">Saved Patterns</h3>
  <div class="saved-list" id="savedList"></div>

  <div class="footer-note">Click cells to toggle any of the 32 steps by hand. Shift-click a saved pattern to delete it.</div>
</div>

<script src="js/audio-engine.js"></script>
<script src="js/storage-client.js"></script>
<script src="js/assist-client.js"></script>
<script src="js/assist-panel.js"></script>
<script src="js/freeplay.js"></script>
</body>
</html>
