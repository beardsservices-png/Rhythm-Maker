<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm Shop — Round Robin</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/roundrobin.css">
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div>
      <h1>Round Robin</h1>
      <div class="sub">turn-based layered builder</div>
    </div>
    <a class="back" href="index.html">&larr; Modes</a>
  </div>

  <div id="notice" class="notice"></div>

  <div class="transport">
    <button id="playBtn" class="primary">Play</button>
    <button id="genBBtn" disabled title="Add at least one layer first">Generate Section B</button>
    <button id="songFormBtn">Play Song Form</button>
    <button id="sectionToggleBtn">Toggle A/B</button>
    <div class="field">
      <label for="bpm">BPM: <span id="bpmVal">100</span></label>
      <input type="range" id="bpm" min="60" max="200" value="100">
    </div>
    <div class="mississippi" id="mississippi">1 Mississippi</div>
    <div class="song-form" id="songFormLabel"></div>
  </div>

  <div id="layers"></div>

  <div id="addLayerControls" class="add-layer"></div>

  <div id="assistPanel"></div>

  <div class="footer-note">Each new layer halves in step density — 32nd, 16th, 8th, quarter, half, whole. Click cells to toggle any step by hand. "Generate Section B" thins melodic layers and foregrounds bass/kick while busying the hi-hat.</div>
</div>

<script src="js/audio-engine.js"></script>
<script src="js/storage-client.js"></script>
<script src="js/assist-client.js"></script>
<script src="js/assist-panel.js"></script>
<script src="js/roundrobin.js"></script>
</body>
</html>
